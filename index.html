<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System SPA</title>

    <!-- Google Fonts for UI text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Roboto+Mono:wght@400;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Import Map to handle Three.js and modules correctly without a bundler -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- GSAP (3.12.5) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

</head>
<body>
    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Start Screen Overlay -->
    <div id="start-screen">
        <button id="start-button">INICIA LA EXPERIENCIA</button>
    </div>

    <!-- Easter Egg Overlay -->
    <div id="easter-egg" class="hidden">
        <div class="easter-egg-content">
            <p>He sido muy honesto contigo, y sabes que, me alegra haber sido muy honesto contigo, si me gustas, pero no espero que sientas lo mismo, espero tener tu amistad.</p>
            <button id="easter-egg-back">Regresar</button>
        </div>
    </div>

    <!-- UI Overlay Container -->
    <div id="ui-container">
        <!-- Back Button, initially hidden -->
        <button id="back-button" class="hidden">BACK</button>

        <!-- Planet Info Text, initially hidden -->
        <div id="planet-info" class="hidden">
            <h1 id="planet-name">Planet Name</h1>
            <div id="planet-description">
                <!-- 5 lines of text here -->
            </div>
        </div>

        <!-- Tutorial Overlay -->
        <div id="tutorial-overlay" class="hidden">
            <div id="tut-move" class="tut-step">
                <!-- SVG Icon for dragging/swiping -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 9v2a2 2 0 0 0 2 2h4"/>
                    <path d="M11 17l-4-4 4-4"/>
                    <path d="M19 15v-2a2 2 0 0 0-2-2h-4"/>
                    <path d="M13 7l4 4-4 4"/>
                    <path d="M12 3v18"/>
                </svg>
                <span>Desliza para mover y haz zoom</span>
            </div>
            <div id="tut-tap" class="tut-step hidden">
                <!-- SVG Icon for tapping -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 13v-8.5a1.5 1.5 0 0 1 3 0v7.5"/>
                    <path d="M11 11.5v-2a1.5 1.5 0 0 1 3 0v2.5"/>
                    <path d="M14 10.5v-1.5a1.5 1.5 0 0 1 3 0v4.5"/>
                    <path d="M17 11.5a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1-6 6h-2c-2.5 0-5-1.5-6-4l-2.5-4"/>
                </svg>
                <span>Toca un planeta para explorar</span>
            </div>
        </div>
    </div>

    <!-- Application Scripts as Modules to support Three.js post-processing correctly -->
    <script type="module" src="js/AudioManager.js"></script>
    <script type="module" src="js/PlanetFactory.js"></script>
    <script type="module" src="js/SceneManager.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
